steps:
  # 1. Build the container image once
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/sr-1906369/rcau-repo/rcau-uid-auth:$COMMIT_SHA', '.']

  # 2. Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/sr-1906369/rcau-repo/rcau-uid-auth:$COMMIT_SHA']

  # 3. Deploy to US (us-central1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
    - 'run'
    - 'deploy'
    - 'rcau-uid-auth'
    - '--image'
    - 'us-central1-docker.pkg.dev/sr-1906369/rcau-repo/rcau-uid-auth:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    # Large bulk exports (hundreds of endpoints) build the ZIP in a single
    # long-running request; raise the request timeout past Cloud Run's 300s
    # default and give the in-memory archive more headroom.
    - '--timeout'
    - '3600'
    - '--memory'
    - '2Gi'
    # Durable audit storage (Deskphone Ring Time "Recent audits" + cross-instance
    # download). Uses --update-env-vars so it MERGES with the service's existing
    # env vars (RC/SM secrets etc.) rather than replacing them the way
    # --set-env-vars would. The GCS bucket + Firestore were provisioned manually.
    - '--update-env-vars'
    - 'AUDIT_BUCKET=rcau-api-tools-audits'

images:
- 'us-central1-docker.pkg.dev/sr-1906369/rcau-repo/rcau-uid-auth:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
